<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#2c2c2b;--muted:#716e69;--adjacent:#827f7a;--today:#2c2c2b;--today-text:#fff;--hover:#f0efed;--focus:#2783de;--cell:clamp(20px,calc((100vh - 86px)/6),27px)}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--ink:#f4f4f2;--muted:#bebbb5;--adjacent:#aaa7a2;--today:#f4f4f2;--today-text:#191919;--hover:#383836;--focus:#5e9fe8}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:8px}.calendar{width:min(100%,224px)}
.header{display:flex;align-items:center;justify-content:center}h1{margin:0;min-width:82px;text-align:center;font-size:14px;font-weight:600;letter-spacing:.02em}.nav-btn{border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;cursor:pointer;width:44px;height:44px;display:grid;place-items:center}.nav-btn:hover{background:var(--hover);color:var(--ink)}.nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}.arrow{font-size:22px;line-height:1;transform:translateY(-1px)}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}th{color:var(--muted);font-size:11px;line-height:1;font-weight:500;height:21px;text-align:center}td{height:var(--cell);text-align:center;font-size:13px;line-height:1;font-weight:400}.date{width:var(--cell);height:var(--cell);display:inline-grid;place-items:center;border-radius:50%}.other{color:var(--adjacent)}.today{color:var(--today-text);background:var(--today);font-weight:600}
</style></head><body><main><div class="calendar" aria-label="Monthly calendar">
<div class="header"><button class="nav-btn" id="prev" type="button" aria-label="Previous month"><span class="arrow" aria-hidden="true">‹</span></button><h1 id="month" aria-live="polite"></h1><button class="nav-btn" id="next" type="button" aria-label="Next month"><span class="arrow" aria-hidden="true">›</span></button></div>
<table aria-labelledby="month"><thead><tr><th scope="col">Sun</th><th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th><th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Sat</th></tr></thead><tbody id="days"></tbody></table>
</div></main>
<script>
(()=>{const tz='America/Bogota',fmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric'}),monthFmt=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'short',year:'numeric'}),fullFmt=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric',year:'numeric'});function today(){const p=Object.fromEntries(fmt.formatToParts(new Date()).map(({type,value})=>[type,value]));return {year:+p.year,month:+p.month-1,day:+p.day}}let current=today(),year=current.year,month=current.month;
function render(){document.getElementById('month').textContent=monthFmt.format(new Date(Date.UTC(year,month,1))).toUpperCase();const start=new Date(Date.UTC(year,month,1)).getUTCDay(),count=new Date(Date.UTC(year,month+1,0)).getUTCDate(),weeks=Math.ceil((start+count)/7),body=document.getElementById('days');body.replaceChildren();for(let row=0;row<weeks;row++){const tr=document.createElement('tr');for(let col=0;col<7;col++){const td=document.createElement('td'),date=new Date(Date.UTC(year,month,1-start+row*7+col)),s=document.createElement('span');s.className='date';s.textContent=date.getUTCDate();s.setAttribute('aria-label',fullFmt.format(date));if(date.getUTCMonth()!==month)s.classList.add('other');if(date.getUTCFullYear()===current.year&&date.getUTCMonth()===current.month&&date.getUTCDate()===current.day){s.classList.add('today');s.setAttribute('aria-current','date')}td.appendChild(s);tr.appendChild(td)}body.appendChild(tr)}}
function move(delta){const d=new Date(Date.UTC(year,month+delta,1));year=d.getUTCFullYear();month=d.getUTCMonth();render()}document.getElementById('prev').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));render();setInterval(()=>{const n=today();if(n.year!==current.year||n.month!==current.month||n.day!==current.day){const showingCurrent=year===current.year&&month===current.month;current=n;if(showingCurrent){year=n.year;month=n.month}render()}},60000)})();
</script></body></html>
