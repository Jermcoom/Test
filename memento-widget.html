<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life grid</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#2c2c2b;--muted:#716e69;--empty:#e6e5e3;--filled:#77746f}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--ink:#f4f4f2;--muted:#bebbb5;--empty:#41413f;--filled:#b5b2ac}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{display:flex;justify-content:center;align-items:center;min-height:220px;padding:20px 16px}.widget{width:min(100%,240px)}
.grid{display:grid;grid-template-columns:repeat(10,11px);grid-template-rows:repeat(8,11px);justify-content:space-between;row-gap:9px}.dot{width:11px;height:11px;border-radius:50%;background:var(--empty)}.dot.passed{background:var(--filled)}
.details{margin-top:18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
</style></head><body><main><div class="widget"><div class="grid" id="grid" role="img" aria-label="Loading life grid"></div><div class="details"><span id="percent">—</span><span id="days">—</span></div></div></main>
<script>
(()=>{
 const grid=document.getElementById('grid');for(let i=0;i<80;i++){const dot=document.createElement('span');dot.className='dot';grid.appendChild(dot)}
 const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'numeric',day:'numeric'}), birth=Date.UTC(1992,9,26),target=Date.UTC(2072,9,26),dayMs=86400000;
 function update(){const p=Object.fromEntries(fmt.formatToParts(new Date()).map(({type,value})=>[type,value]));const y=+p.year,m=+p.month,d=+p.day,today=Date.UTC(y,m-1,d);const age=y-1992-((m<10||(m===10&&d<26))?1:0),completed=Math.min(80,Math.max(0,age));const days=Math.max(0,Math.ceil((target-today)/dayMs)),percent=Math.max(0,Math.min(100,Math.round((target-today)/(target-birth)*100)));document.getElementById('percent').textContent=percent+'% left';document.getElementById('days').textContent=days.toLocaleString('en-US')+' days left';for(let i=0;i<80;i++)grid.children[i].classList.toggle('passed',i<completed);grid.setAttribute('aria-label',`${completed} of 80 years completed. Each highlighted circle is one completed year.`)}
 update();setInterval(update,60000);
})();
</script></body></html>
