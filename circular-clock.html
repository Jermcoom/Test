<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circular clock</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --disc:#f9f8f7; --ink:#2c2c2b; --muted:#716e69; --track:#e6e5e3; --accent:#918e89; --divider:#c5c2bd; }
  @media(prefers-color-scheme:dark) { :root { --bg:#191919; --disc:#202020; --ink:#f4f4f2; --muted:#bebbb5; --track:#383836; --accent:#a5a29c; --divider:#777570; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); }
  body { font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
  main { display:flex; justify-content:center; align-items:center; padding:16px; min-height:220px; }
  .clock { position:relative; width:190px; height:190px; display:grid; place-items:center; border-radius:50%; background:var(--disc); }
  svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .track, .progress { fill:none; stroke-width:2; }
  .track { stroke:var(--track); }
  .progress { stroke:var(--accent); stroke-linecap:round; }
  .clock-face { display:grid; grid-template-columns:1fr 1fr; align-items:center; width:146px; font-variant-numeric:tabular-nums; }
  .half { min-width:0; display:flex; flex-direction:column; gap:5px; }
  .left { align-items:flex-end; padding-right:10px; border-right:1px solid var(--divider); }
  .right { align-items:flex-start; padding-left:10px; }
  .number { font-size:40px; line-height:1.08; font-weight:350; letter-spacing:-.045em; }
  .sub { font-size:13px; line-height:1.25; font-weight:500; color:var(--muted); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media(max-width:220px) { main { padding:8px; } .clock { max-width:100%; aspect-ratio:1; height:auto; } }
</style>
</head>
<body>
<main aria-label="Clock, Bogotá time">
  <div class="clock">
    <svg viewBox="0 0 190 190" aria-hidden="true"><circle class="track" cx="95" cy="95" r="92"/><circle class="progress" id="progress" cx="95" cy="95" r="92" pathLength="60" stroke-dasharray="0 60"/></svg>
    <div class="clock-face" aria-hidden="true">
      <div class="half left"><span class="number" id="hour">00</span><span class="sub" id="date">00</span></div>
      <div class="half right"><span class="number" id="minute">00</span><span class="sub" id="day">MON</span></div>
    </div>
    <time class="sr-only" id="accessible-time"></time>
  </div>
</main>
<script>
(() => {
  const fmt = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Bogota',hour:'2-digit',minute:'2-digit',day:'2-digit',weekday:'short',hourCycle:'h23'});
  function tick() {
    const now = new Date();
    const parts = Object.fromEntries(fmt.formatToParts(now).map(({type,value}) => [type,value]));
    document.getElementById('hour').textContent = parts.hour;
    document.getElementById('minute').textContent = parts.minute;
    document.getElementById('date').textContent = parts.day;
    document.getElementById('day').textContent = parts.weekday.toUpperCase();
    document.getElementById('progress').setAttribute('stroke-dasharray', `${now.getUTCSeconds()} 60`);
    const time = document.getElementById('accessible-time');
    time.dateTime = now.toISOString();
    time.textContent = `${parts.hour}:${parts.minute}, ${parts.weekday} ${parts.day}, Bogotá time`;
    setTimeout(tick, 1000 - Date.now()%1000 + 10);
  }
  tick();
})();
</script>
</body>
</html>
